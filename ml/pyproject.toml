[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegraph-ai"
version = "0.1.0"
description = "Explainable session-based financial graph analysis engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<26",
    "networkx>=3.3,<4",
    "scipy>=1.12,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
torch = ["torch>=2.4,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
tracegraph-ai = "tracegraph_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
